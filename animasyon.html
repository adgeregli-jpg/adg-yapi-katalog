<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<style>
  :root{ color-scheme:light; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  body{ margin:0; font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  img{ max-width:100%; } [hidden]{ display:none !important; }
</style>
<title>Mahalle Yeniden Doğuyor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500;600&family=Archivo:wght@400;500;600&display=swap">
<style>
  /* Layout: başlık, 16:9 sahne, kumanda şeridi, akış notları */
  :root{
    --ink:#20170f; --ink-soft:#6d5b4e; --paper:#f7f2ec; --panel:#ffffff;
    --line:#e3d8cc; --brand:#ff6a13; --brand-deep:#6b2200; --film:#0b0a09;
    --font-display:"Jost","Trebuchet MS",sans-serif;
    --font-body:"Archivo","Segoe UI",system-ui,sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#f3ece4; --ink-soft:#b6a393; --paper:#17110d; --panel:#231a14;
      --line:#3a2b20; --brand:#ff7d33; --brand-deep:#f0a877; --film:#000;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --ink:#f3ece4; --ink-soft:#b6a393; --paper:#17110d; --panel:#231a14;
    --line:#3a2b20; --brand:#ff7d33; --brand-deep:#f0a877; --film:#000;
    color-scheme: dark;
  }
  body{ background:var(--paper); color:var(--ink); font-family:var(--font-body); }
  .wrap{
    max-width:1040px; margin:0 auto;
    padding-left:max(16px, env(safe-area-inset-left, 0px));
    padding-right:max(16px, env(safe-area-inset-right, 0px));
    padding-block:20px 28px; display:flex; flex-direction:column; gap:22px;
  }
  .masthead{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .brandline{ font-family:var(--font-display); font-weight:300; letter-spacing:.34em; font-size:.78rem; text-transform:uppercase; color:var(--ink-soft); }
  h1{ font-family:var(--font-display); font-weight:300; font-size:clamp(2rem,5.6vw,3.1rem); line-height:1.04; letter-spacing:-.01em; text-wrap:balance; margin:0; }
  h1 em{ font-style:normal; font-weight:500; color:var(--brand); }
  .lede{ max-width:60ch; color:var(--ink-soft); font-size:1rem; line-height:1.6; margin:0; }

  .stage{ position:relative; border-radius:10px; overflow:hidden; background:var(--film); box-shadow:0 18px 50px -24px rgba(32,18,8,.6); aspect-ratio:16/9; }
  .stage canvas{ display:block; position:absolute; inset:0; width:100%; height:100%; }
  #ui{ pointer-events:none; }
  .veil{
    position:absolute; inset:0; display:grid; place-items:center;
    background:radial-gradient(130% 100% at 50% 42%, rgba(10,7,5,.3), rgba(10,7,5,.8));
    border:0; width:100%; padding:0; cursor:pointer; color:#fff; z-index:3;
  }
  .veil[hidden]{ display:none !important; }
  .veil-inner{ display:flex; flex-direction:column; align-items:center; gap:14px; }
  .playdisc{ width:86px; height:86px; border-radius:50%; display:grid; place-items:center; background:var(--brand); transition:transform .25s ease; }
  .veil:hover .playdisc{ transform:scale(1.06); }
  .playdisc svg{ margin-left:5px; }
  .veil-label{ font-family:var(--font-display); font-weight:300; letter-spacing:.26em; text-transform:uppercase; font-size:.76rem; }
  .veil-sub{ font-size:.82rem; color:rgba(255,255,255,.72); }
  .loading{ position:absolute; inset:0; display:grid; place-items:center; color:#fff; font-family:var(--font-display); letter-spacing:.2em; font-size:.8rem; text-transform:uppercase; z-index:4; background:#0b0a09; }
  .loading[hidden]{ display:none !important; }

  .deck{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .btn{ font:inherit; font-size:.85rem; cursor:pointer; border-radius:999px; padding:.55rem 1.05rem;
    border:1px solid var(--line); background:var(--panel); color:var(--ink);
    display:inline-flex; align-items:center; gap:.5rem; transition:border-color .15s, color .15s; }
  .btn:hover{ border-color:var(--brand); color:var(--brand); }
  .btn.primary{ background:var(--brand); border-color:var(--brand); color:#fff; font-weight:600; min-width:116px; justify-content:center; }
  .btn.primary:hover{ color:#fff; filter:brightness(1.06); }
  .btn:focus-visible, .veil:focus-visible{ outline:2px solid var(--brand); outline-offset:3px; }
  .track{ flex:1 1 220px; min-width:0; height:4px; border-radius:2px; background:var(--line); overflow:hidden; }
  .track span{ display:block; height:100%; width:0%; background:var(--brand); }
  .clock{ font-variant-numeric:tabular-nums; font-size:.82rem; color:var(--ink-soft); min-width:86px; text-align:right; }

  .beats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .beat{ background:var(--panel); padding:16px 18px 18px; display:flex; flex-direction:column; gap:6px; min-width:0; }
  .beat .at{ font-family:var(--font-display); font-variant-numeric:tabular-nums; font-size:.72rem; letter-spacing:.18em; color:var(--brand); }
  .beat h2{ font-family:var(--font-display); font-weight:400; font-size:1.02rem; margin:0; }
  .beat p{ margin:0; font-size:.85rem; line-height:1.55; color:var(--ink-soft); }
  .note{ font-size:.82rem; color:var(--ink-soft); line-height:1.6; max-width:72ch; margin:0; }
  .note b{ color:var(--ink); font-weight:600; }
  @media (prefers-reduced-motion: reduce){ .playdisc{ transition:none; } }
</style>

</head>
<body>
<div class="wrap">
  <div class="stage" id="stage">
    <canvas id="gl"></canvas>
    <canvas id="ui" width="1280" height="720"></canvas>
    <div class="loading" id="loading">Sahne hazırlanıyor…</div>
    <button class="veil" id="veil" type="button" aria-label="Filmi sesli oynat" hidden>
      <span class="veil-inner">
        <span class="playdisc">
          <svg width="30" height="34" viewBox="0 0 30 34" aria-hidden="true"><path d="M2 2 L28 17 L2 32 Z" fill="#fff"/></svg>
        </span>
        <span class="veil-label">Sesli oynat</span>
        <span class="veil-sub">32 saniye · müzik ve çocuk sesleri</span>
      </span>
    </button>
  </div>

  <div class="deck">
    <button class="btn primary" id="toggle" type="button">Oynat</button>
    <button class="btn" id="restart" type="button">Baştan</button>
    <button class="btn" id="mute" type="button" aria-pressed="false">Sesi kapat</button>
    <div class="track" aria-hidden="true"><span id="bar"></span></div>
    <div class="clock" id="clock">00:00 / 00:47</div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.150.1/three.min.js"></script>

  function poseChar(c, o){
    const u = c.userData, ph = o.phase||0, amp = o.amp||0, t = o.t||0;
    u.legs[0].rotation.x =  Math.sin(ph)*amp;
    u.legs[1].rotation.x = -Math.sin(ph)*amp;
    u.arms[0].rotation.x = -Math.sin(ph)*amp*0.95 + (o.armL||0);
    u.arms[1].rotation.x =  Math.sin(ph)*amp*0.95 + (o.armR||0);
    u.arms[0].rotation.z =  (o.armLz||0);
    u.arms[1].rotation.z =  (o.armRz||0);

    // zıplama + esneme/sıkışma: havada uzar, yere basarken yayılır
    const bob = o.bob||0, hop = Math.abs(Math.sin(ph));
    c.position.y = (o.y||0) + hop*bob;
    const sqk = (o.squash===undefined ? 1 : o.squash) * (bob > 0.001 ? 1 : 0);
    const st = (hop - 0.5) * 0.34 * sqk;
    const bx = (1 - st*0.7) * (o.sx||1), by = (1 + st) * (o.sy||1);
    c.scale.set(bx, by, bx);

    // gövde salınımı ve kafanın gecikmeli takibi
    c.rotation.z = (o.lean||0) + Math.sin(ph*0.5)*amp*0.06;
    u.head.rotation.y = (o.headY||0) + Math.sin(t*1.7 + u.seed)*0.05;
    u.head.rotation.x = (o.headX||0) - st*0.22;
    u.head.rotation.z = (o.headZ||0) + Math.sin(ph)*amp*0.10;

    // göz kırpma: her karakterde kaydırılmış ritim
    const k = (t*0.62 + u.seed*0.37) % 1;
    const blink = k > 0.955 ? 1 - Math.abs(k - 0.9775)/0.0225 : 0;
    u.eyes.forEach(function(e){ e.scale.y = 1.18 * (1 - blink*0.92); });
    u.pupils.forEach(function(p){ p.scale.y = 1.04 * (1 - blink*0.92); });

    const talking = !!o.talking;
    u.talk.visible = talking;
    u.tongue.visible = false;
    u.smile.visible = !talking && !o.sad;
    u.frown.visible = !talking && !!o.sad;
    if (talking){
      const op = 0.55 + Math.abs(Math.sin(t*16.5))*1.05;
      u.talk.scale.set(1.08, op*0.66, 0.78);
      u.tongue.visible = op > 1.25;
    }
    u.brows.forEach(function(b,i){
      const s = o.sad ? 1 : (o.surprise ? -1 : 0);
      b.rotation.z = s>0 ? (i===0?0.34:-0.34) : (s<0 ? (i===0?-0.12:0.12) : (i===0?0.14:-0.14));
      b.position.y = u.headR * (o.sad ? 0.40 : (o.surprise ? 0.56 : 0.44));
    });
  }

  })();
  crane.position.set(-28, 0, -26); crane.visible = false; scene.add(crane);

  /* ===================== 2B üst katman (logo, alt yazı, kapanış) ===================== */
  const drawLogo = (x, y, s, color, alpha)=> drawLogoOn(ux, x, y, s, color, alpha);

  function subtitle(text, a, warm){
    ux.save(); ux.globalAlpha = a;
    ux.font = '400 34px Jost, "Trebuchet MS", sans-serif';
    ux.textAlign='center'; ux.textBaseline='alphabetic';
    const y = UIH - 56;
    const g = ux.createLinearGradient(0, y-70, 0, UIH);
    g.addColorStop(0,'rgba(6,4,3,0)'); g.addColorStop(1,'rgba(6,4,3,.6)');
    ux.fillStyle = g; ux.fillRect(0, y-70, UIW, 130);
    ux.shadowColor='rgba(0,0,0,.6)'; ux.shadowBlur=12;
    ux.fillStyle = warm ? '#ffe3cd' : '#ffffff';
    ux.fillText(text, UIW/2, y);
    ux.restore();
  }

  /* ---- çizgi film süslemeleri: kapsül rozet, yıldız, darbe çizgileri ---- */
  function roundRect(g, x, y, w, h, r){
    g.beginPath();
    g.moveTo(x+r, y);
    g.lineTo(x+w-r, y); g.arcTo(x+w, y, x+w, y+r, r);
    g.lineTo(x+w, y+h-r); g.arcTo(x+w, y+h, x+w-r, y+h, r);
    g.lineTo(x+r, y+h); g.arcTo(x, y+h, x, y+h-r, r);
    g.lineTo(x, y+r); g.arcTo(x, y, x+r, y, r);
    g.closePath();
  }
  // taahhüt rozeti: turuncu kapsül + beyaz onay işareti
  function badge(x, y, text, a, pop){
    ux.save(); ux.globalAlpha = a;
    ux.font = '600 27px Jost, "Trebuchet MS", sans-serif';
    const w = ux.measureText(text).width + 94, h = 52;
    ux.translate(x, y + h/2); ux.scale(pop, pop); ux.translate(0, -h/2);
    ux.fillStyle = 'rgba(58,18,0,.32)'; roundRect(ux, 4, 5, w, h, h/2); ux.fill();
    ux.fillStyle = '#ff6a13';            roundRect(ux, 0, 0, w, h, h/2); ux.fill();
    ux.fillStyle = '#ffffff';
    ux.beginPath(); ux.arc(32, h/2, 16, 0, Math.PI*2); ux.fill();
    ux.strokeStyle = '#ff6a13'; ux.lineWidth = 4.6; ux.lineCap='round'; ux.lineJoin='round';
    ux.beginPath(); ux.moveTo(24, h/2+1); ux.lineTo(30.5, h/2+7.5); ux.lineTo(40, h/2-7.5); ux.stroke();
    ux.fillStyle = '#ffffff'; ux.textAlign='left'; ux.textBaseline='middle';
    ux.fillText(text, 58, h/2 + 1);
    ux.restore();
  }
  function star(x, y, r, a){
    ux.save(); ux.globalAlpha = a; ux.fillStyle = '#fff6c9';
    ux.beginPath();
    for (let i=0;i<8;i++){
      const ang = i/8*Math.PI*2 - Math.PI/2, rr = (i%2) ? r*0.40 : r;
      const px = x + Math.cos(ang)*rr, py = y + Math.sin(ang)*rr;
      if (i) ux.lineTo(px, py); else ux.moveTo(px, py);
    }
    ux.closePath(); ux.fill(); ux.restore();
  }
  const BURSTS = [25.5, 28.1];        // kuleler tamamlanır / park açılır

  function drawUI(t){
    ux.clearRect(0,0,UIW,UIH);
    // alt yazılar
    for (const c of CAPS){
      const a = sstep(c.a, c.a+0.5, t) * (1 - sstep(c.b-0.45, c.b, t));
      if (a > 0.01) subtitle(c.s, a, false);
    }
    // replik alt yazıları (kapanış sloganı kartın kendisinde yazılı)
    for (const k in VOICES){
      const v = VOICES[k];
      if (v.nosub) continue;
      const a = sstep(v.at-0.2, v.at+0.15, t) * (1 - sstep(v.at+v.dur, v.at+v.dur+0.4, t));
      if (a > 0.01) subtitle('“' + v.text + '”', a, true);
    }
    // logo damgası: zıplayarak oturur (çizgi film "boing")
    const la = sstep(TL.logo[0], TL.logo[0]+0.4, t) * (1 - sstep(TL.logo[1]-0.6, TL.logo[1], t));
    if (la > 0.01){
      const pop = back(sstep(TL.logo[0], TL.logo[0]+0.75, t));
      const s = 0.76 * pop;
      ux.save(); ux.globalAlpha = la*0.42; ux.fillStyle='#0c0907'; ux.fillRect(0,0,UIW,UIH); ux.restore();
      drawLogo(UIW/2 - LOGO_W*s/2, 232 + (1-pop)*40, s, '#ffffff', la);
      ux.save(); ux.globalAlpha = la; ux.fillStyle='#ff6a13';
      const rw = 300*clamp(pop,0,1);
      ux.fillRect(UIW/2-rw/2, 420, rw, 3); ux.restore();
      // damga anında etrafa yıldız saçılır
      const d = t - TL.logo[0];
      if (d > 0.2 && d < 1.1){
        const k = (d-0.2)/0.9;
        for (let i=0;i<10;i++){
          const ang = i/10*Math.PI*2 + 0.3;
          star(UIW/2 + Math.cos(ang)*(170 + k*210), 300 + Math.sin(ang)*(120 + k*150),
               19*(1-k), (1-k)*la);
        }
      }
    }
    // taahhüt rozetleri: inşaat sırasında sırayla açılır
    BADGES.forEach(function(b, i){
      const a = sstep(b.t, b.t+0.35, t) * (1 - sstep(BADGE_OUT, BADGE_OUT+0.5, t));
      if (a > 0.01) badge(72, 146 + i*70, b.s, a, back(sstep(b.t, b.t+0.5, t)));
    });
    // yıkım darbesi: ışınsal çizgiler
    const imp = t - (TL.demo[0] + 0.5);
    if (imp > 0 && imp < 0.55){
      const k = imp/0.55;
      ux.save(); ux.globalAlpha = (1-k)*0.45; ux.strokeStyle='#ffffff'; ux.lineWidth=5;
      for (let i=0;i<18;i++){
        const a2 = i/18*Math.PI*2, r0 = 130 + k*520, r1 = r0 + 90;
        ux.beginPath();
        ux.moveTo(UIW/2 + Math.cos(a2)*r0, UIH/2 + Math.sin(a2)*r0*0.62);
        ux.lineTo(UIW/2 + Math.cos(a2)*r1, UIH/2 + Math.sin(a2)*r1*0.62);
        ux.stroke();
      }
      ux.restore();
    }
    // sevinç yıldızları: kuleler tamamlanınca ve park açılınca
    BURSTS.forEach(function(bt, bi){
      const d = t - bt;
      if (d < 0 || d > 1.3) return;
      const k = d/1.3;
      for (let i=0;i<14;i++){
        const ang = rnd(bi*31 + i*3.7)*Math.PI*2;
        const rad = 70 + k*330*(0.5 + rnd(i*7.1)*0.9);
        star(UIW/2 + Math.cos(ang)*rad*1.35, UIH/2 + Math.sin(ang)*rad*0.80,
             17*(1-k), (1-k)*0.9);
      }
    });
    // köşe filigranı
    const wa = sstep(TL.logo[1]+0.2, TL.logo[1]+1.0, t) * (1 - sstep(TL.endcard-0.6, TL.endcard-0.1, t));
    if (wa > 0.01) drawLogo(UIW-214, 36, 0.245, 'rgba(255,255,255,.92)', wa*0.9);
    // şimşek
    let fl = 0;
    for (const f of FLASH){ const d=t-f; if (d>=0 && d<0.5) fl = Math.max(fl, Math.exp(-d*9)*(d<0.06?1:0.7)); }
    if (fl > 0.002){ ux.fillStyle='rgba(226,236,255,'+(fl*0.55)+')'; ux.fillRect(0,0,UIW,UIH); }
    // kapanış kartı
    const ea = sstep(TL.endcard, TL.endcard+0.8, t);
    if (ea > 0.01){
      ux.save(); ux.globalAlpha = ea;
      const g = ux.createLinearGradient(0,0,UIW,UIH);
      g.addColorStop(0,'#3d1403'); g.addColorStop(0.5,'#8d2d01'); g.addColorStop(1,'#d2560b');
      ux.fillStyle=g; ux.fillRect(0,0,UIW,UIH); ux.restore();
      const l2 = sstep(TL.endcard+0.4, TL.endcard+1.1, t);
      drawLogo(UIW/2 - LOGO_W*0.70/2, 150, 0.70, '#ffffff', l2);
      const t2 = sstep(TL.endcard+1.0, TL.endcard+1.6, t);
      if (t2 > 0.01){
        ux.save(); ux.globalAlpha=t2; ux.textAlign='center';
        ux.fillStyle='#ffb98a'; ux.fillRect(UIW/2-130, 318, 260*t2, 3);
        ux.fillStyle='#fff'; ux.font='300 40px Jost, "Trebuchet MS", sans-serif';
        ux.fillText('Kentsel dönüşüm odaklı,', UIW/2, 392);
        ux.fillText('farklı bir müteahhitlik firması.', UIW/2, 444);
        ux.restore();
      }
      // taahhütler: kapanışta tek sırada
      const p3 = sstep(TL.endcard+2.3, TL.endcard+2.9, t);
      if (p3 > 0.01){
        ux.save();
        ux.font = '600 27px Jost, "Trebuchet MS", sans-serif';
        const ws = BADGES.map(function(b){ return ux.measureText(b.s).width + 94; });
        const gap = 18, tot = ws.reduce(function(a,b){ return a+b; }, 0) + gap*2;
        let px = UIW/2 - tot/2;
        ux.restore();
        BADGES.forEach(function(b, i){
          const st = TL.endcard + 2.3 + i*0.22;
          badge(px, 512, b.s, sstep(st, st+0.4, t), back(sstep(st, st+0.6, t)));
          px += ws[i] + gap;
        });
      }
      const ca2 = sstep(TL.endcard+3.9, TL.endcard+4.5, t);
      if (ca2 > 0.01){
        ux.save(); ux.globalAlpha=ca2; ux.textAlign='center';
        ux.fillStyle='rgba(255,236,220,.92)'; ux.font='400 26px Archivo, sans-serif';
        ux.fillText('0551 497 30 80   ·   KDZ. Ereğli / Zonguldak', UIW/2, 644);
        ux.restore();
      }
    }
    // açılış karartması
    const fin = 1 - sstep(0, 1.0, t);
    if (fin > 0.002){ ux.fillStyle='rgba(0,0,0,'+fin+')'; ux.fillRect(0,0,UIW,UIH); }
  }

  /* ===================== sahne güncellemesi ===================== */
  const cMud = new THREE.Color(0x4a3824), cGrass = new THREE.Color(0x4d8a38);
  const cSkyDark = new THREE.Color(0x2f313c), cSkyDay = new THREE.Color(0x4ea8e2);
  const cFogDark = new THREE.Color(0x3a3a44), cFogDay = new THREE.Color(0xbfe2f4);
  const cHemiD = new THREE.Color(0x5a6070), cHemiDay = new THREE.Color(0xbfe4ff);
  const cPud = new THREE.Color(0x56606e), cPatch = new THREE.Color(0x6aa84c);
  const cCloudD = new THREE.Color(0x6a6a72), cCloudDay = new THREE.Color(0xffffff);

  function camAt(t){
    let i = 0;
    while (i < CAM.length-2 && t > CAM[i+1].t) i++;
    const a = CAM[i], b = CAM[i+1];
    const k = sstep(a.t, b.t, t);
    camera.position.set(lerp(a.p[0],b.p[0],k), lerp(a.p[1],b.p[1],k), lerp(a.p[2],b.p[2],k));
    camera.lookAt(lerp(a.l[0],b.l[0],k), lerp(a.l[1],b.l[1],k), lerp(a.l[2],b.l[2],k));
  }

  function speakerAt(t){
    for (const k in VOICES){ const v = VOICES[k]; if (t >= v.at && t <= v.at + v.dur) return k; }
    return null;
  }

  function renderAt(t){
    t = clamp(t, 0, DUR);
    const hope  = sstep(TL.hope[0], TL.hope[1], t);     // gökyüzü: başvuruyla açılır
    const green = sstep(TL.green[0], TL.green[1], t);   // zemin: dönüşümle yeşillenir
    const rainA = 1 - sstep(TL.rainOut[0], TL.rainOut[1], t);
    const demo  = sstep(TL.demo[0], TL.demo[1], t);
    const rise  = sstep(TL.rise[0], TL.rise[1], t);
    const park  = sstep(TL.park[0], TL.park[1], t);
    const ppl   = sstep(TL.people[0], TL.people[1], t);
    const spk   = speakerAt(t);
    camAt(t);                                           // güneşin yüzü kameraya dönecek

    // atmosfer
    scene.background = cSkyDark.clone().lerp(cSkyDay, hope);
    scene.fog.color.copy(cFogDark).lerp(cFogDay, hope);
    scene.fog.near = lerp(40, 70, hope); scene.fog.far = lerp(140, 230, hope);
    hemi.color.copy(cHemiD).lerp(cHemiDay, hope);
    hemi.intensity = lerp(0.75, 0.72, hope);
    sun.intensity = lerp(0.3, 1.0, hope);
    sunBall.visible = hope > 0.05;
    groundMat.color.copy(cMud).lerp(cGrass, green);

    let fl = 0;
    for (const f of FLASH){ const d=t-f; if (d>=0 && d<0.4) fl = Math.max(fl, Math.exp(-d*10)); }
    sun.intensity += fl*1.1;

    // bulutlar
    clouds.forEach(function(g,i){
      g.position.x = ((-90 + rnd(i)*190) + t*(0.8+rnd(i*3)*1.2) + 140) % 280 - 140;
      g.children.forEach(function(m){ m.material.color.copy(cCloudD).lerp(cCloudDay, hope); });
    });

    // su birikintileri -> çim lekeleri
    puddles.forEach(function(m,i){
      m.material.color.copy(cPud).lerp(cPatch, green);
      m.material.opacity = lerp(0.95, 0.35, green);
      m.position.y = 0.03 + Math.sin(t*2+i)*0.002;
    });

    // çamurdaki şemsiyeli kız (l1, l3) — yağmur dinince şemsiyeyi indirir,
    // dönüşümü izlerken yukarı bakar
    kidMud.visible = ppl < 0.05;
    umbrella.visible = rainA > 0.08;
    if (kidMud.visible){
      const uzgun = t < 12.6;
      poseChar(kidMud, {phase:t*1.25, amp:0.045, y:0, sad:uzgun, surprise: spk==='l3',
                        talking: spk==='l1' || spk==='l3', t:t,
                        armR: uzgun ? -0.78 : -1.95, armRz: uzgun ? -0.62 : -0.88,
                        armLz: 0.22, headX: uzgun ? 0.07 : -0.16, lean: uzgun ? -0.025 : 0});
      // şemsiye omuzda hafifçe sallanır
      umbrella.rotation.z = -0.24 + Math.sin(t*1.15)*0.05;
    }

    // pencere ışığı ve camdaki oğlan (l2)
    const winOn = 1 - sstep(12.4, 13.0, t);
    winLight.material.color.setRGB(0.84*winOn, 0.60*winOn, 0.29*winOn);
    winGlow.intensity = winOn * 1.5;
    winG.visible = demo < 0.02 && winOn > 0.02;
    kidWin.visible = winOn > 0.05 && demo < 0.02;
    if (kidWin.visible){
      poseChar(kidWin, {phase:t*1.3, amp:0.05, y:3.38 + Math.sin(t*1.1)*0.02, sad:true,
                        talking: spk==='l2', t:t, armRz:-0.5, armR:-1.25, headX:0.05});
    }

    // eski binalar: yıkım
    // çizgi film çöküşü: ev kendi içine basılır, yanlara yayılır, toza karışır
    oldMeshes.forEach(function(o,i){
      const d = clamp((demo - i*0.045)/0.74, 0, 1);
      o.g.scale.y = Math.max(0.001, 1 - d*d*1.18);
      const yay = (1 + Math.sin(d*Math.PI)*0.16) * (1 - clamp((d-0.72)/0.28, 0, 1));
      o.g.scale.x = o.g.scale.z = Math.max(0.001, yay);
      o.g.position.y = -d * 0.5;
      o.g.rotation.z = o.b.rot + (d>0.1 ? (rnd(i)-0.5)*0.14*d : 0);
      o.g.visible = d < 0.995;
    });
    // toz
    const dustA = demo * (1 - sstep(TL.demo[1]+0.4, TL.demo[1]+2.6, t));
    dustMat.opacity = dustA*0.75;
    if (dustA > 0.01){
      for (let i=0;i<DUST_N;i++){
        const b = OLDB[i % OLDB.length];
        const ph = ((t - TL.demo[0])*0.5 + rnd(i*3)) % 1;
        dustPos[i*3]   = b.x + (rnd(i*5)-0.5)*b.w*1.1;
        dustPos[i*3+1] = 0.2 + ph*3.6 + rnd(i*7)*0.9;
        dustPos[i*3+2] = -13 + (rnd(i*11)-0.5)*8;
      }
      dustGeo.attributes.position.needsUpdate = true;
    }

    // yeni kuleler: sırayla, kademeli yükselir; tepede hafifçe yaylanır
    const grow = function(x){ const c1=0.55, c3=c1+1, u2=x-1; return 1 + c3*u2*u2*u2 + c1*u2*u2; };
    towers.forEach(function(o,i){
      const r = clamp((rise - i*0.13)/0.48, 0, 1);
      const e = grow(r);
      o.g.position.y = lerp(-o.b.h-2, 0, e);
      o.g.visible = r > 0.002;
      o.g.scale.y = 1 + Math.sin(r*Math.PI)*0.05;        // yükselirken hafif uzama
    });

    // vinç
    crane.visible = t > 12.9 && t < 20.0;
    if (crane.visible){
      crane.rotation.y = Math.sin(t*0.26)*0.5;
      crane.position.y = lerp(-34, 0, sstep(12.9, 13.9, t)) + lerp(0, -34, sstep(19.0, 20.0, t));
    }

    // ADG Yapı iş yeri: başvuru sahnesinde yerine oturur, sonra mahallede kalır
    const ofis = sstep(TL.office[0], TL.office[0]+1.1, t);
    shop.visible = ofis > 0.01;
    if (shop.visible){
      shop.position.y = lerp(-7, 0, back(ofis));
      shop.scale.y = 1 + Math.sin(ofis*Math.PI)*0.06;
    }

    // mahalleli başvuruya yürür; kapıya varan içeri girer
    const yuru = t - (TL.office[0] + 0.5);
    crowd.forEach(function(c,i){
      const x = -2 - i*2.5 + yuru*3.6;
      c.visible = yuru > 0 && t < TL.office[1] + 0.8 && x > -21 && x < 13.6;
      if (c.visible){
        c.position.set(x, 0, 4.3 + (i%3)*0.95);
        poseChar(c, {phase:t*5.4 + i*1.25, amp:0.46, y:0, bob:0.05, squash:0.8, t:t,
                     armRz:-0.16, armLz:0.16});
      }
    });

    // ADG logolu yelekli işçiler: inşaat boyunca çalışır
    const isci = t > TL.work[0] && t < TL.work[1] + 0.4;
    workers.forEach(function(c,i){
      c.visible = isci;
      if (!c.visible) return;
      const w = WORKERS[i], uw = t - TL.work[0];
      const o = {phase:uw*2.2 + i, amp:0.10, y:0, t:t};
      if (w.act === 'cakma'){            // çakma: kol yukarı aşağı
        o.armR = -1.95 + Math.abs(Math.sin(uw*7.5))*1.25; o.armRz = -0.78;
        o.armL = -0.60; o.armLz = 0.42;
      } else if (w.act === 'isaret'){    // yükselen kuleyi işaret eder
        o.armR = -2.45; o.armRz = -0.55; o.armL = -0.20; o.headX = -0.30;
      } else if (w.act === 'tasima'){    // kalas taşıyarak yürür
        o.armR = -1.15; o.armL = -1.15; o.armRz = -0.12; o.armLz = 0.12;
        o.phase = uw*4.2 + i; o.amp = 0.34; o.bob = 0.04; o.squash = 0.7;
        c.position.x = w.x + Math.sin(uw*0.55)*2.2;
      } else {                           // el sallayarak selam verir
        o.armR = -2.60 + Math.sin(uw*6)*0.30; o.armRz = -0.90; o.armL = -0.30;
      }
      poseChar(c, o);
      const pop = back(sstep(TL.work[0] + i*0.18, TL.work[0] + 0.9 + i*0.18, t));
      c.scale.multiplyScalar(pop);        // sahneye zıplayarak girer
    });
    // taşınan kalas, taşıyan işçinin elinde
    plank.visible = isci;
    if (plank.visible){
      const wc = workers[2];
      const pr = wc.rotation.y;
      plank.position.set(wc.position.x + Math.sin(pr)*0.40, 1.44, wc.position.z + Math.cos(pr)*0.40);
      plank.rotation.y = wc.rotation.y; plank.rotation.z = 0.04;
      plank.scale.setScalar(back(sstep(TL.work[0]+0.36, TL.work[0]+1.26, t)));
    }

    // ağaçlar: zıplayarak açar
    trees.forEach(function(g,i){
      const s = clamp((park - i*0.06)/0.6, 0, 1);
      g.visible = s > 0.01;
      const b = g.userData.base || (g.userData.base = g.scale.x);
      g.scale.setScalar(b * back(s));
      g.rotation.z = Math.sin(t*1.3 + i)*0.025;           // rüzgârda salınım
    });

    // çiçekler: dönüşümle birlikte zıplayarak açar, rüzgârda sallanır
    flowers.forEach(function(g,i){
      const s = clamp((park - rnd(i*3.3)*0.35)/0.55, 0, 1);
      g.visible = s > 0.01;
      if (g.visible){
        g.scale.setScalar(back(s) * (0.8 + rnd(i*7.7)*0.5));
        g.rotation.z = Math.sin(t*2.1 + i*1.7)*0.10;
      }
    });

    // kelebekler
    flutters.forEach(function(g,i){
      g.visible = green > 0.55;
      if (!g.visible) return;
      const u = g.userData, a = t*0.55 + i*1.9;
      g.position.set(Math.cos(a)*(5+i*2.3) + 1, 0.85 + Math.sin(t*1.7+i)*0.38, 4 + Math.sin(a*0.8)*4);
      g.lookAt(camera.position);                            // kanatlar kameraya dönük
      u.wing.scale.x = 0.35 + Math.abs(Math.sin(t*15 + i*2))*0.65;   // kanat çırpışı
    });

    // kuşlar: gökyüzünde süzülür
    birds.forEach(function(g,i){
      g.visible = green > 0.45;
      if (!g.visible) return;
      const u = g.userData, sp = 5.5 + rnd(i)*2.6;
      g.position.set(-60 + ((t-13)*sp + i*17) % 130, 20 + rnd(i*5)*9, -46 - rnd(i*3)*22);
      const fl = Math.sin(t*6.5 + i*1.3)*0.65;
      u.wings.forEach(function(w){ w.piv.rotation.z = -w.d*fl; });
    });

    // gülen güneş: yüzü kameraya döner, ışınları yavaşça çevrilir
    if (sunBall.visible){
      sunBall.lookAt(camera.position);
      sunRays.rotation.z = t*0.32;
      const pop = back(sstep(TL.hope[0]+0.8, TL.hope[1], t));
      sunBall.scale.setScalar(0.3 + 0.7*pop + Math.sin(t*1.6)*0.016);
    }

    // yağmur
    rainMesh.visible = rainA > 0.02;
    if (rainMesh.visible){
      const n = Math.round(RAIN_N*rainA);
      for (let i=0;i<RAIN_N;i++){
        if (i < n){
          const sp = 16 + rnd(i)*10;
          dummy.position.set(-46 + rnd(i*3)*92, 26 - ((t*sp + rnd(i*7)*30) % 28), -30 + rnd(i*11)*46);
          dummy.rotation.set(0,0,0.12); dummy.scale.set(1,1,1);
        } else dummy.scale.set(0,0,0);
        dummy.updateMatrix(); rainMesh.setMatrixAt(i, dummy.matrix);
      }
      rainMesh.instanceMatrix.needsUpdate = true;
    }

    // park sahnesi
    const showPark = ppl > 0.01;
    parkChars.forEach(function(c){ c.visible = showPark; });
    ball.visible = showPark; balloon.visible = showPark; balloonStr.visible = showPark;
    if (showPark){
      const u = t - TL.people[0];
      // kidA (l4): coşkuyla zıplar, kolunu havaya kaldırır
      poseChar(kidA, {phase:u*5.6, amp:0.34, y:0, bob:0.12, squash:1.2, talking:spk==='l4', t:t,
                      armR:-2.30 + Math.sin(u*8)*0.22, armRz:-1.00, armL:-0.40, headX:-0.06});
      // kidB (l5, l7): hoplar, elinde balon
      poseChar(kidB, {phase:u*6.2, amp:0.30, y:0, bob:0.14, squash:1.3,
                      talking: spk==='l5' || spk==='l7', surprise: spk==='l5', t:t,
                      armR:-2.45, armRz:-0.62, armLz:0.42});
      // kidC (l6): topu bekler, sağa sola sallanır
      poseChar(kidC, {phase:u*3.0, amp:0.22, y:0, bob:0.06, talking:spk==='l6', t:t,
                      armL:-0.50, armLz:0.75 + Math.sin(u*6)*0.20, armRz:-0.80,
                      headZ:Math.sin(u*2)*0.05});
      poseChar(dad,  {phase:u*2.2, amp:0.26, y:0, bob:0.03, t:t, armRz:-0.22});
      poseChar(mom,  {phase:u*2.2+0.6, amp:0.26, y:0, bob:0.03, t:t, armLz:0.22});
      poseChar(kidF, {phase:u*3.4, amp:0.38, y:0, bob:0.09, squash:1.25, t:t, armLz:1.15, armRz:-1.15});
      const walk = clamp(u*0.62, 0, 14);
      dad.position.x = -12.0 + walk; mom.position.x = -9.4 + walk; kidF.position.x = -10.7 + walk;
      // top: yere çarpınca yayılır, havada uzar
      const bh = Math.abs(Math.sin(u*3.4));
      ball.position.set(-1.1 + Math.sin(u*1.1)*1.6, 0.34 + bh*1.7, 3.1);
      ball.rotation.x = u*3.4; ball.rotation.z = u*1.2;
      const bs = 1 + (0.5 - bh)*0.30;
      ball.scale.set(bs, 2-bs, bs);
      // balon: kidB'nin elinde, salınarak
      const kb = kidB.position.y;
      balloon.position.set(-2.00, 3.18 + kb + Math.sin(u*1.8)*0.09, 4.34);
      balloon.rotation.z = Math.sin(u*1.5)*0.12;
      balloonStr.position.set(-2.12, 2.34 + kb, 4.32);
      balloonStr.rotation.z = Math.sin(u*1.5)*0.08;
    }

    renderer.render(scene, camera);
    drawUI(t);
  }

  /* ===================== ses ===================== */
  // Çizgi film orkestrası: gergin yaylılar/timpani -> ksilofon, pizzicato, tuba
  function b64ToBuf(b64){
    const bin = atob(b64); const len = bin.length; const u8 = new Uint8Array(len);
    for (let i=0;i<len;i++) u8[i] = bin.charCodeAt(i);
    return u8.buffer;
  }
  function noiseBuffer(ac, sec){
    const b = ac.createBuffer(1, Math.max(1,Math.floor(ac.sampleRate*sec)), ac.sampleRate);
    const d = b.getChannelData(0);
    for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
    return b;
  }
  function env(ac, dest, st, atk, dur, peak){
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, st);
    g.gain.exponentialRampToValueAtTime(Math.max(peak,0.0002), st+atk);
    g.gain.exponentialRampToValueAtTime(0.0001, st+dur);
    g.connect(dest); return g;
  }
  function osc(ac, dest, type, f, st, dur, peak, atk, det){
    const o = ac.createOscillator(); o.type=type; o.frequency.value=f; if(det) o.detune.value=det;
    const g = env(ac, dest, st, atk||0.008, dur, peak);
    o.connect(g); o.start(st); o.stop(st+dur+0.05); return o;
  }
  // ksilofon / marimba
  function xylo(ac, dest, f, st, peak){
    osc(ac, dest, 'sine', f, st, 0.5, peak, 0.004);
    osc(ac, dest, 'sine', f*3.01, st, 0.16, peak*0.38, 0.003);
    osc(ac, dest, 'triangle', f*2, st, 0.22, peak*0.2, 0.003);
  }
  // pizzicato yaylı
  function pizz(ac, dest, f, st, peak){
    const o = ac.createOscillator(); o.type='sawtooth'; o.frequency.value=f;
    const lp = ac.createBiquadFilter(); lp.type='lowpass';
    lp.frequency.setValueAtTime(3600, st); lp.frequency.exponentialRampToValueAtTime(700, st+0.14);
    const g = env(ac, dest, st, 0.004, 0.26, peak);
    o.connect(lp); lp.connect(g); o.start(st); o.stop(st+0.3);
  }
  // tuba / fagot bas
  function tuba(ac, dest, f, st, dur, peak){
    const o = ac.createOscillator(); o.type='square'; o.frequency.value=f;
    const lp = ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=f*4.2; lp.Q.value=2;
    const g = env(ac, dest, st, 0.02, dur, peak);
    o.connect(lp); lp.connect(g); o.start(st); o.stop(st+dur+0.05);
  }
  function noiseHit(ac, dest, st, dur, peak, type, f, q){
    const s = ac.createBufferSource(); s.buffer = noiseBuffer(ac, Math.max(dur,0.2));
    const bf = ac.createBiquadFilter(); bf.type=type; bf.frequency.value=f; if(q) bf.Q.value=q;
    const g = env(ac, dest, st, 0.006, dur, peak);
    s.connect(bf); bf.connect(g); s.start(st); s.stop(st+dur+0.05);
    return bf;
  }
  const M = (n)=> 440*Math.pow(2,(n-69)/12);   // midi -> Hz

  /* ---- çizgi film orkestrası: ukulele (telli sentez), marimba, marakas ---- */
  const ksCache = {};
  function ksBuf(ac, freq, dur, damp){          // Karplus-Strong telli çalgı
    const key = Math.round(freq*100)+'_'+dur+'_'+damp;
    if (ksCache[key]) return ksCache[key];
    const sr = ac.sampleRate, n = Math.ceil(sr*dur), N = Math.max(3, Math.round(sr/freq));
    const b = ac.createBuffer(1, n, sr), out = b.getChannelData(0);
    const ring = new Float32Array(N);
    let p = 0;
    for (let i=0;i<N;i++){ p = p*0.68 + (Math.random()*2-1)*0.32; ring[i] = p; }
    let idx = 0;
    for (let i=0;i<n;i++){
      const cur = ring[idx], nxt = ring[(idx+1)%N];
      out[i] = cur;
      ring[idx] = (cur + nxt) * 0.5 * damp;
      idx = (idx+1) % N;
    }
    const tail = Math.floor(n*0.14);
    for (let i=n-tail;i<n;i++) out[i] *= (n-i)/tail;
    ksCache[key] = b; return b;
  }
  function pluck(ac, dest, f, st, gain, dur, damp, tone){
    const s = ac.createBufferSource(); s.buffer = ksBuf(ac, f, dur||1.3, damp||0.9955);
    const lp = ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = tone||4200; lp.Q.value=0.7;
    const g = ac.createGain(); g.gain.value = gain;
    s.connect(lp); lp.connect(g); g.connect(dest);
    s.start(st); s.stop(st + (dur||1.3));
  }
  function strum(ac, dest, notes, st, gain, spread){
    notes.forEach(function(n,i){ pluck(ac, dest, M(n), st + i*(spread||0.022), gain*(1-i*0.07), 1.05, 0.9938, 4600); });
  }
  function marimba(ac, dest, f, st, gain){
    osc(ac, dest, 'sine', f, st, 0.60, gain, 0.003);
    osc(ac, dest, 'sine', f*3.98, st, 0.13, gain*0.40, 0.002);
    osc(ac, dest, 'sine', f*9.2, st, 0.05, gain*0.12, 0.002);
    noiseHit(ac, dest, st, 0.015, gain*0.45, 'bandpass', 2500, 1.6);
  }
  function shaker(ac, dest, st, gain){ noiseHit(ac, dest, st, 0.05, gain, 'highpass', 7200, 0.7); }
  function woodblock(ac, dest, st, gain){
    osc(ac, dest, 'sine', 1150, st, 0.04, gain, 0.001);
    noiseHit(ac, dest, st, 0.028, gain*0.5, 'bandpass', 2100, 2.6);
  }
  function tamb(ac, dest, st, gain){ noiseHit(ac, dest, st, 0.26, gain, 'highpass', 5400, 0.5); }

  function scheduleScore(ac, dest, T0){
    /* ---- 1. bölüm: yağmurlu, hüzünlü mahalle ---- */
    const dark = ac.createGain(); dark.gain.value = 1; dark.connect(dest);
    // yumuşak tremololu yaylılar (üçgen dalga: vızıltısız)
    [55, 65.4, 82.4].forEach(function(f,i){
      const o = ac.createOscillator(); o.type='triangle'; o.frequency.value=f;
      const lp = ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=700; lp.Q.value=1.2;
      const g = ac.createGain(); g.gain.setValueAtTime(0.0001, T0);
      g.gain.exponentialRampToValueAtTime(0.115, T0+2.4);
      g.gain.setValueAtTime(0.115, T0+9.8);
      g.gain.exponentialRampToValueAtTime(0.0001, T0+12.2);
      const trem = ac.createGain(); trem.gain.value = 1;
      const lfo = ac.createOscillator(); lfo.type='sine'; lfo.frequency.value = 5.6+i*0.3;
      const lg = ac.createGain(); lg.gain.value = 0.42;
      lfo.connect(lg); lg.connect(trem.gain); lfo.start(T0); lfo.stop(T0+12.4);
      o.connect(lp); lp.connect(trem); trem.connect(g); g.connect(dark);
      o.start(T0); o.stop(T0+12.4);
    });
    // yalnız klarnet/theremin ezgisi (minör, hüzünlü)
    [[1.3,349.2],[3.4,311.1],[5.6,261.6],[7.6,293.7],[9.5,261.6],[11.3,233.1]].forEach(function(p){
      const o = ac.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(p[1]*0.97, T0+p[0]);
      o.frequency.linearRampToValueAtTime(p[1], T0+p[0]+0.45);
      o.frequency.linearRampToValueAtTime(p[1]*0.94, T0+p[0]+2.1);
      const vib = ac.createOscillator(); vib.type='sine'; vib.frequency.value=5.0;
      const vg = ac.createGain(); vg.gain.value=3.4; vib.connect(vg); vg.connect(o.frequency);
      vib.start(T0+p[0]); vib.stop(T0+p[0]+2.3);
      const lp = ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1800;
      const g = env(ac, dark, T0+p[0], 0.45, 2.2, 0.085);
      o.connect(lp); lp.connect(g); o.start(T0+p[0]); o.stop(T0+p[0]+2.3);
    });
    // ağır, boğuk telli vuruşlar (sessiz adımlar)
    [1.0,1.9,2.8,4.6,5.5,6.4,8.0,8.9,10.1,11.0,11.9].forEach(function(b,i){
      pluck(ac, dark, M(45 - (i%3)*2), T0+b, 0.14, 1.0, 0.988, 1300);
    });
    // timpani + şimşek
    FLASH.forEach(function(f){
      if (f > 12.0) return;
      const o = ac.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(94, T0+f); o.frequency.exponentialRampToValueAtTime(44, T0+f+0.5);
      const g = env(ac, dark, T0+f, 0.012, 1.5, 0.36);
      o.connect(g); o.start(T0+f); o.stop(T0+f+1.6);
      noiseHit(ac, dark, T0+f+0.1, 1.7, 0.24, 'lowpass', 230, 0.8);
    });
    // yağmur
    const rs = ac.createBufferSource(); rs.buffer = noiseBuffer(ac, 2.5); rs.loop = true;
    const hp = ac.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=1100;
    const rg = ac.createGain();
    rg.gain.setValueAtTime(0.0001, T0);
    rg.gain.exponentialRampToValueAtTime(0.075, T0+1.2);
    rg.gain.setValueAtTime(0.075, T0+10.6);
    rg.gain.exponentialRampToValueAtTime(0.0001, T0+13.4);
    rs.connect(hp); hp.connect(rg); rg.connect(dark);
    rs.start(T0); rs.stop(T0+13.6);

    /* ---- geçiş ---- */
    const TR = T0 + 12.4;
    noiseHit(ac, dark, TR, 2.2, 0.26, 'highpass', 5200, 0.6);        // zil
    (function(){                                                      // yukarı kayan düdük
      const o = ac.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(400, TR+0.1); o.frequency.exponentialRampToValueAtTime(1750, TR+0.9);
      const g = env(ac, dark, TR+0.1, 0.05, 0.95, 0.14);
      o.connect(g); o.start(TR+0.1); o.stop(TR+1.1);
    })();
    // yıkım gümbürtüsü: eski bloklar inerken (19.4)
    (function(){
      const D = T0 + 19.4;
      const o = ac.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(124, D); o.frequency.exponentialRampToValueAtTime(32, D+1.3);
      const g = env(ac, dark, D, 0.02, 2.4, 0.42);
      o.connect(g); o.start(D); o.stop(D+2.6);
      noiseHit(ac, dark, D, 2.1, 0.22, 'lowpass', 480, 0.7);
      noiseHit(ac, dark, D+0.9, 1.6, 0.14, 'lowpass', 380, 0.7);
    })();
    // inşaat ritmi: ADG yelekli işçilerin çekiç sesleri (21–28)
    for (let h=0; h<13; h++){
      const ht = T0 + 21.0 + h*0.56;
      woodblock(ac, dark, ht, 0.052);
      noiseHit(ac, dark, ht, 0.05, 0.030, 'bandpass', 3400, 2.2);
    }

    /* ---- 2. bölüm: neşeli çocuk şarkısı ---- */
    const T1 = T0 + 13.2, bpm = 124, beat = 60/bpm, bar = beat*4, NBAR = 14;
    const happy = ac.createGain(); happy.gain.value = 0.0001; happy.connect(dest);
    happy.gain.setValueAtTime(0.0001, T1-0.2);
    happy.gain.exponentialRampToValueAtTime(1.85, T1+0.6);

    const UKE = { C:[60,64,67,72], F:[60,65,69,72], G:[59,62,67,71], Am:[60,64,69,72] };
    const BARS = [
      {ch:'C',  root:48, mel:[72,74,76,74, 72,null,67,69]},
      {ch:'F',  root:41, mel:[72,72,74,72, 69,null,null,null]},
      {ch:'G',  root:43, mel:[71,72,74,72, 71,69,67,null]},
      {ch:'C',  root:48, mel:[72,null,79,null, 76,null,72,null]},
      {ch:'Am', root:45, mel:[76,76,74,72, 69,null,69,71]},
      {ch:'F',  root:41, mel:[72,74,76,77, 76,null,74,null]},
      {ch:'G',  root:43, mel:[74,72,71,74, 72,null,71,null]}
    ];
    for (let b=0; b<NBAR; b++){
      const bt = T1 + b*bar, B = BARS[b % BARS.length], ch = UKE[B.ch];
      // bas (telli, kısa)
      pluck(ac, happy, M(B.root), bt, 0.3, 1.0, 0.9915, 900);
      pluck(ac, happy, M(B.root+7), bt+beat*2, 0.26, 0.9, 0.9915, 900);
      // ukulele: 2. ve 4. vuruşta tıngırtı
      strum(ac, happy, ch, bt+beat, 0.1);
      strum(ac, happy, ch, bt+beat*3, 0.09);
      // melodi: marimba
      for (let e=0;e<8;e++){
        const et = bt + e*beat/2;
        if (B.mel[e] != null){
          marimba(ac, happy, M(B.mel[e]), et, 0.22);
          if (e===0) marimba(ac, happy, M(B.mel[e]+12), et, 0.07);
        }
        shaker(ac, happy, et, e%2 ? 0.028 : 0.05);
      }
      woodblock(ac, happy, bt+beat, 0.07);
      woodblock(ac, happy, bt+beat*3, 0.055);
      if (b%2===0) tamb(ac, happy, bt, 0.07);
    }
    // son bardan kapanış kartına köprü: yukarı marimba koşusu
    const BR = T1 + NBAR*bar;
    [67,69,71,72].forEach(function(n,i){ marimba(ac, happy, M(n), BR - 0.52 + i*0.13, 0.17); });
    happy.gain.setValueAtTime(1.85, BR+0.1);
    happy.gain.exponentialRampToValueAtTime(0.0001, BR+0.6);

    /* ---- kapanış kartı: sıcak akor, slogan altında sürdürüm ---- */
    const card = ac.createGain(); card.gain.value = 1.2; card.connect(dest);
    const ENDC = T0 + 41.3;
    strum(ac, card, [48,55,60,64,67,72], ENDC, 0.16, 0.035);
    [60,64,67].forEach(function(n){ marimba(ac, card, M(n), ENDC, 0.16); });
    marimba(ac, card, M(84), ENDC+0.1, 0.1);
    // akordeon/klarnet sıcaklığı: yavaş açılan yumuşak yastık
    [48,60,64,67].forEach(function(n,i){
      const o = ac.createOscillator(); o.type = i<1 ? 'triangle' : 'sine'; o.frequency.value = M(n);
      const lp = ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2200;
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, ENDC);
      g.gain.exponentialRampToValueAtTime(i<1?0.1:0.05, ENDC+0.6);
      g.gain.setValueAtTime(i<1?0.1:0.05, ENDC+0.7);
      g.gain.exponentialRampToValueAtTime(i<1?0.045:0.022, ENDC+1.4);
      g.gain.setValueAtTime(i<1?0.045:0.022, ENDC+4.4);
      g.gain.exponentialRampToValueAtTime(0.0001, ENDC+5.8);
      o.connect(lp); lp.connect(g); g.connect(card);
      o.start(ENDC); o.stop(ENDC+6.0);
    });
    // slogandan sonra son çıkış
    const FIN = T0 + 46.35;
    [72,76,79,84].forEach(function(n,i){ marimba(ac, card, M(n), FIN+i*0.11, 0.2); });
    strum(ac, card, [60,64,67,72], FIN+0.44, 0.15, 0.03);
    tamb(ac, card, FIN+0.44, 0.08);
    return {dark:dark, happy:happy};
  }

  /* ---- canlı oynatma ---- */
  let ac=null, master=null, musicGain=null, voiceGain=null, t0=0, muted=false, voiceBufs={};
  function buildAudio(){
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    ac = new AC();
    master = ac.createGain(); master.gain.value = muted?0:0.85; master.connect(ac.destination);
    musicGain = ac.createGain(); musicGain.gain.value = 1; musicGain.connect(master);
    voiceGain = ac.createGain(); voiceGain.gain.value = 1.0; voiceGain.connect(master);
    t0 = ac.currentTime + 0.16;
    scheduleScore(ac, musicGain, t0);
    // replikler + müzik kısması
    for (const k in VOICES){
      const v = VOICES[k], buf = voiceBufs[k];
      if (!buf) continue;
      const s = ac.createBufferSource(); s.buffer = buf;
      s.connect(voiceGain); s.start(t0 + v.at);
      const g = musicGain.gain;
      g.setValueAtTime(1, t0+v.at-0.18);
      g.linearRampToValueAtTime(0.3, t0+v.at-0.02);
      g.setValueAtTime(0.3, t0+v.at+v.dur);
      g.linearRampToValueAtTime(1, t0+v.at+v.dur+0.35);
    }
    return true;
  }

  /* ===================== kumanda ===================== */
  const veil=document.getElementById('veil'), loading=document.getElementById('loading');
  const btnToggle=document.getElementById('toggle'), btnRestart=document.getElementById('restart'),
        btnMute=document.getElementById('mute'), bar=document.getElementById('bar'), clock=document.getElementById('clock');
  let playing=false, ended=false, lastT=6.6, fallbackStart=0;

  function sizeTo(w,h){
    renderer.setSize(w, h, false);
    camera.aspect = w/h; camera.updateProjectionMatrix();
  }
  function fit(){
    const r = stage.getBoundingClientRect();
    sizeTo(Math.max(320, Math.round(r.width)), Math.max(180, Math.round(r.height)));
    renderAt(playing ? now() : lastT);
  }
  function now(){
    if (ac && ac.state === 'running') return clamp(ac.currentTime - t0, 0, DUR);
    if (ac) return lastT;
    return clamp(performance.now()/1000 - fallbackStart, 0, DUR);
  }
  const fmt=(s)=>{s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};

  function loop(){
    if (playing){
      const t = now(); lastT = t;
      renderAt(t);
      bar.style.width = (t/DUR*100).toFixed(2)+'%';
      clock.textContent = fmt(t)+' / '+fmt(DUR);
      if (t >= DUR-0.01){ playing=false; ended=true; btnToggle.textContent='Tekrar oynat';
        if (ac){ try{ ac.suspend(); }catch(e){} } }
    }
    requestAnimationFrame(loop);
  }
  function start(){
    ended = false;
    if (!ac){ if (!buildAudio()) fallbackStart = performance.now()/1000; }
    if (ac) ac.resume().catch(function(){});
    playing = true; veil.hidden = true; btnToggle.textContent = 'Duraklat';
  }
  function pause(){ playing=false; btnToggle.textContent='Oynat'; if (ac){ try{ ac.suspend(); }catch(e){} } }
  function restart(){
    if (ac){ try{ ac.close(); }catch(e){} ac=null; musicGain=null; }
    lastT = 0; renderAt(0); bar.style.width='0%'; start();
  }
  veil.addEventListener('click', function(){ ended?restart():start(); });
  btnToggle.addEventListener('click', function(){ if(ended){restart();return;} playing?pause():start(); });
  btnRestart.addEventListener('click', restart);
  btnMute.addEventListener('click', function(){
    muted = !muted; if (master) master.gain.value = muted?0:0.85;
    btnMute.textContent = muted ? 'Sesi aç' : 'Sesi kapat';
    btnMute.setAttribute('aria-pressed', muted?'true':'false');
  });
  window.addEventListener('resize', fit);

  /* ===================== başlatma ===================== */
  function decodeVoices(){
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return Promise.resolve();
    const tmp = new AC();
    const jobs = Object.keys(VOICES).map(function(k){
      return tmp.decodeAudioData(b64ToBuf(VOICES[k].b64))
        .then(function(b){ voiceBufs[k] = b; })
        .catch(function(){});
    });
    return Promise.all(jobs).then(function(){ try{ tmp.close(); }catch(e){} });
  }

  function boot(){
    fit();
    loading.hidden = true; veil.hidden = false;
    requestAnimationFrame(loop);
  }
  const fontsReady = (document.fonts && document.fonts.load)
    ? Promise.all([document.fonts.load('400 34px Jost'), document.fonts.load('200 118px Jost'), document.fonts.load('400 24px Archivo')]).catch(function(){})
    : Promise.resolve();
  Promise.all([fontsReady, decodeVoices()]).then(boot).catch(boot);

  /* ===================== dışa açılan kancalar (MP4 çekimi) ===================== */
  window.FILM = {
    DUR: DUR,
    renderAt: renderAt,
    renderMode: function(w,h){
      document.querySelectorAll('.wrap > *').forEach(function(el){ if (el !== stage) el.style.display='none'; });
      document.querySelector('.wrap').style.cssText = 'max-width:none;padding:0;margin:0;gap:0;display:block';
      document.body.style.margin='0'; document.documentElement.style.padding='0';
      stage.style.cssText = 'position:relative;width:'+w+'px;height:'+h+'px;border-radius:0;aspect-ratio:auto;overflow:hidden;background:#000';
      veil.hidden = true; loading.hidden = true;
      sizeTo(w,h);
      return true;
    },
    // MP4 için müziği çevrim dışı sentezler (WAV, base64)
    renderMusic: function(){
      const OC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
      const oc = new OC(2, Math.ceil(44100*(DUR+1.5)), 44100);
      const out = oc.createGain(); out.gain.value = 0.85; out.connect(oc.destination);
      scheduleScore(oc, out, 0);
      return oc.startRendering().then(function(buf){
        const n = buf.length, ch = 2, bytes = 44 + n*ch*2;
        const ab = new ArrayBuffer(bytes), dv = new DataView(ab);
        const ws = function(off, s){ for (let i=0;i<s.length;i++) dv.setUint8(off+i, s.charCodeAt(i)); };
        ws(0,'RIFF'); dv.setUint32(4, bytes-8, true); ws(8,'WAVEfmt ');
        dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,ch,true);
        dv.setUint32(24,44100,true); dv.setUint32(28,44100*ch*2,true);
        dv.setUint16(32,ch*2,true); dv.setUint16(34,16,true); ws(36,'data');
        dv.setUint32(40, n*ch*2, true);
        const L = buf.getChannelData(0), R = buf.numberOfChannels>1 ? buf.getChannelData(1) : L;
        let off = 44;
        for (let i=0;i<n;i++){
          dv.setInt16(off, Math.max(-1,Math.min(1,L[i]))*32767, true); off+=2;
          dv.setInt16(off, Math.max(-1,Math.min(1,R[i]))*32767, true); off+=2;
        }
        let bin=''; const u8 = new Uint8Array(ab);
        for (let i=0;i<u8.length;i+=0x8000) bin += String.fromCharCode.apply(null, u8.subarray(i, i+0x8000));
        return btoa(bin);
      });
    }
  };
})();
</script>
