function makeChar(o){
  const G=new THREE.Group(),R=o.headR||0.42;
  const skin=toon(o.skin),shirt=toon(o.shirt),pants=toon(o.pants);
  const hipY=o.hipY||0.72,shY=o.shY||1.2,headY=o.headY||1.6;
  const body=new THREE.Group();G.add(body);
  const legs=[],arms=[];
  for(const d of[-1,1]){
    const p=new THREE.Group();p.position.set(d*0.17,hipY,0);
    const L=hipY-0.34;
    const l=outl(new THREE.Mesh(new THREE.CapsuleGeometry(0.135,L,4,10),pants),1.1);l.position.y=-L/2-0.1;p.add(l);
    const s=outl(new THREE.Mesh(new THREE.SphereGeometry(0.2,12,10),toon(o.shoe||0x3a2f26)),1.07);s.scale.set(1,0.6,1.4);s.position.set(0,-hipY+0.1,0.09);p.add(s);
    body.add(p);legs.push(p);
  }
  const tw=o.belly||0.31;
  const torso=outl(new THREE.Mesh(new THREE.CapsuleGeometry(tw,Math.max(0.05,shY-hipY-0.1),4,14),shirt),1.09);
  torso.position.y=(hipY+shY)/2+0.02;torso.castShadow=true;body.add(torso);
  if(o.hood){const h=outl(new THREE.Mesh(new THREE.TorusGeometry(0.26,0.09,8,16),shirt),1.06);h.rotation.x=Math.PI/2;h.position.y=shY+0.02;body.add(h);}
  for(const d of[-1,1]){
    const p=new THREE.Group();p.position.set(d*(tw+0.03),shY-0.03,0);
    const a=outl(new THREE.Mesh(new THREE.CapsuleGeometry(0.105,o.armLen||0.3,4,10),o.sleeve?toon(o.sleeve):shirt),1.11);a.position.y=-((o.armLen||0.3)/2+0.1);p.add(a);
    const hd=outl(new THREE.Mesh(new THREE.SphereGeometry(0.15,12,10),skin),1.08);hd.position.y=-((o.armLen||0.3)+0.17);p.add(hd);
    body.add(p);arms.push(p);
  }
  const head=new THREE.Group();head.position.y=headY;
  const sk=outl(new THREE.Mesh(new THREE.SphereGeometry(R,26,20),skin),1.07);sk.scale.set(1,1.04,0.96);sk.castShadow=true;head.add(sk);
  if(o.hair){const hr=new THREE.Mesh(new THREE.SphereGeometry(R*1.05,24,16,0,Math.PI*2,0,Math.PI*(o.hairCov||0.42)),toon(o.hair));
    hr.position.set(0,R*0.08,-R*0.06);hr.scale.set(1.03,1.08,1.03);head.add(hr);}
  if(o.tuft){const tf=new THREE.Mesh(new THREE.ConeGeometry(R*0.18,R*0.5,8),toon(o.tuft));tf.position.set(R*0.05,R*1.02,0);tf.rotation.z=-0.4;head.add(tf);}
  if(o.bun){for(const d of[-1,1]){const b=outl(new THREE.Mesh(new THREE.SphereGeometry(R*0.3,12,10),toon(o.hair)),1.07);b.position.set(d*R*0.95,R*0.25,-R*0.25);head.add(b);}}
  if(o.scarf){const sc=new THREE.Mesh(new THREE.SphereGeometry(R*1.12,24,16,0,Math.PI*2,0,Math.PI*0.62),toon(o.scarf));sc.position.set(0,R*0.02,-R*0.12);sc.scale.set(1,1.05,1.02);head.add(sc);
    const tie=new THREE.Mesh(new THREE.TorusGeometry(R*0.98,R*0.12,8,24,Math.PI),toon(o.scarf));tie.rotation.set(0.25,0,Math.PI);tie.position.set(0,-R*0.12,-R*0.12);head.add(tie);}
  if(o.cap){const c=outl(new THREE.Mesh(new THREE.SphereGeometry(R*1.07,24,14,0,Math.PI*2,0,Math.PI*0.4),toon(o.cap)),1.05);c.position.y=R*0.14;head.add(c);
    const v=new THREE.Mesh(new THREE.CylinderGeometry(R*0.7,R*0.7,0.04,20,1,false,-Math.PI/2,Math.PI),toon(o.cap));v.position.set(0,R*0.5,(o.capBack?-1:1)*R*0.55);v.rotation.x=(o.capBack?-1:1)*0.15;if(o.capBack)v.rotation.y=Math.PI;head.add(v);}
  const eyes=[],pupils=[],brows=[];
  for(const d of[-1,1]){
    const w=new THREE.Mesh(new THREE.SphereGeometry(R*0.36,18,14),basic(0xffffff));w.position.set(d*R*0.4,R*0.02,R*0.78);w.scale.set(1,1.15,0.48);head.add(w);eyes.push(w);
    const pu=new THREE.Mesh(new THREE.SphereGeometry(R*0.17,14,12),basic(0x1a0f08));pu.position.set(d*R*0.4,0,R*0.94);pu.scale.set(1,1.05,0.5);head.add(pu);pupils.push(pu);
    const sp=new THREE.Mesh(new THREE.SphereGeometry(R*0.06,8,8),basic(0xffffff));sp.position.set(d*R*0.4+R*0.07,R*0.09,R*0.99);head.add(sp);
    const b=new THREE.Mesh(new THREE.BoxGeometry(R*0.42,R*(o.thickBrow?0.12:0.075),R*0.09),toon(o.browC||o.hair||0x2a1d14));
    b.position.set(d*R*0.4,R*0.46,R*0.82);head.add(b);brows.push(b);
  }
  if(o.glasses){for(const d of[-1,1]){const g=new THREE.Mesh(new THREE.TorusGeometry(R*0.36,R*0.035,6,20),basic(0x111111));g.position.set(d*R*0.4,R*0.02,R*0.95);head.add(g);}
    const br=new THREE.Mesh(new THREE.BoxGeometry(R*0.14,R*0.035,R*0.03),basic(0x111111));br.position.set(0,R*0.06,R*0.98);head.add(br);}
  for(const d of[-1,1]){const c=new THREE.Mesh(new THREE.SphereGeometry(R*0.24,12,10),new THREE.MeshBasicMaterial({color:0xf2897a,transparent:true,opacity:0.55}));
    c.position.set(d*R*0.7,-R*0.3,R*0.64);c.scale.set(1,0.66,0.34);head.add(c);}
  const nose=outl(new THREE.Mesh(new THREE.SphereGeometry(R*(o.nose||0.13),12,10),toon(o.noseC||0xe3a084)),1.06);
  nose.position.set(0,-R*0.2,R*0.95);nose.scale.set(1,0.9,0.9);head.add(nose);
  if(o.stache){const m=outl(new THREE.Mesh(new THREE.CapsuleGeometry(R*0.1,R*0.5,4,8),toon(o.stache)),1.06);m.rotation.z=Math.PI/2;m.position.set(0,-R*0.36,R*0.9);m.scale.set(1,1,0.6);head.add(m);}
  if(o.beard){const bd=new THREE.Mesh(new THREE.SphereGeometry(R,22,14,0,Math.PI*2,Math.PI*0.68,Math.PI*0.32),toon(o.beard));bd.position.set(0,-R*0.04,R*0.04);bd.scale.set(1.04,1.08,1.02);head.add(bd);}
  if(o.paci){const p=outl(new THREE.Mesh(new THREE.TorusGeometry(R*0.16,R*0.05,6,14),toon(0x5ad1ff)),1.1);p.position.set(0,-R*0.48,R*0.98);head.add(p);}
  const my=o.beard?-0.56:-0.5;
  const smile=new THREE.Mesh(new THREE.TorusGeometry(R*0.3,R*0.06,8,20,Math.PI),basic(0x53261a));smile.position.set(0,R*my,R*0.8);smile.rotation.z=Math.PI;head.add(smile);
  const frown=smile.clone();frown.rotation.z=0;frown.position.y=R*(my-0.2);head.add(frown);
  const flat=new THREE.Mesh(new THREE.BoxGeometry(R*0.4,R*0.07,R*0.05),basic(0x53261a));flat.position.set(0,R*(my-0.05),R*0.88);head.add(flat);
  const talk=new THREE.Mesh(new THREE.SphereGeometry(R*0.22,14,12),basic(0x4a1e14));talk.position.set(0,R*(my-0.04),R*0.8);head.add(talk);
  body.add(head);
  G.userData={body,legs,arms,head,smile,frown,flat,talk,eyes,pupils,brows,R,seed:o.seed||1,paci:!!o.paci};
  return G;
}
function pose(c,o){
  const u=c.userData,t=o.t||0,ph=o.ph||0,a=o.amp||0;
  u.legs[0].rotation.x=Math.sin(ph)*a+(o.sit?-1.45:0); u.legs[1].rotation.x=-Math.sin(ph)*a+(o.sit?-1.45:0);
  u.arms[0].rotation.x=-Math.sin(ph)*a*0.9+(o.armL||0); u.arms[1].rotation.x=Math.sin(ph)*a*0.9+(o.armR||0);
  u.arms[0].rotation.z=-(o.armLz||0); u.arms[1].rotation.z=(o.armRz||0);
  u.body.position.y=o.sit?-0.32:0; u.body.rotation.x=o.bodyX||0; u.body.rotation.z=o.bodyZ||0;
  u.head.rotation.set(o.headX||0,(o.headY||0)+Math.sin(t*1.6+u.seed)*0.04,o.headZ||0);
  const k=(t*0.55+u.seed*0.37)%1,bl=k>0.955?1-Math.abs(k-0.9775)/0.0225:0;
  const sq=o.squint?0.45:(o.wide?1.3:1);
  u.eyes.forEach(e=>e.scale.y=1.15*sq*(1-bl*0.92)); u.pupils.forEach(p=>{p.scale.y=1.05*Math.min(1,sq)*(1-bl*0.92);p.position.x=Math.sign(p.position.x)*u.R*0.4+(o.look||0)*u.R*0.12;});
  let m=o.mouth||'smile'; if(u.paci&&m!=='scream')m='none';
  u.smile.visible=m==='smile';u.frown.visible=m==='frown';u.flat.visible=m==='flat';u.talk.visible=m==='talk'||m==='scream';
  if(m==='talk'){const op=clamp(o.open==null?0.5:o.open,0,1.2);u.talk.scale.set(1.05,0.15+op*1.1,0.7);}
  if(m==='scream')u.talk.scale.set(1.25,1.6+Math.sin(t*30)*0.15,0.7);
  u.brows.forEach((b,i)=>{const s=o.brow||0;b.rotation.z=(i===0?1:-1)*s*0.35;b.position.y=u.R*(0.46+(o.browUp||0));});
}

function winTex(base){const c=document.createElement('canvas');c.width=128;c.height=256;const g=c.getContext('2d');g.fillStyle=base;g.fillRect(0,0,128,256);
  for(let y=14;y<250;y+=40)for(let x=12;x<120;x+=38){g.fillStyle='#3a2a20';g.fillRect(x-2,y-2,26,28);g.fillStyle=rnd()<0.3?'#ffe9a0':'#9ad7ff';g.fillRect(x,y,22,24);}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;}

function pop(a,t){return back(sm(a,a+0.28,t));}
function captions(t){
  let L=null;for(const l of LINES)if(l.cap&&t>=l.s-0.05&&t<=l.e+0.35){L=l;}
  if(!L)return;
  const ws=L.words;let ci=0;for(let i=0;i<ws.length;i++)if(t>=ws[i].s-0.02)ci=i;
  const g0=Math.floor(ci/3)*3, grp=ws.slice(g0,g0+3);
  let size=84;ui.font=`900 ${size}px ${FONT}`;
  const parts=grp.map(w=>w.w.toLocaleUpperCase('tr'));const sp=24;
  let widths=parts.map(p=>ui.measureText(p).width);let total=widths.reduce((a,b)=>a+b,0)+sp*(parts.length-1);
  if(total>960){const f=960/total;size=Math.floor(size*f);ui.font=`900 ${size}px ${FONT}`;widths=parts.map(p=>ui.measureText(p).width);total=widths.reduce((a,b)=>a+b,0)+sp*(parts.length-1);}
  let x=W/2-total/2;const y=1600;const k=pop(grp[0].s-0.05,t);
  ui.save();ui.translate(W/2,y);ui.scale(k,k);ui.translate(-W/2,-y);
  parts.forEach((p,i)=>{const on=(g0+i)===ci;txt(p,x+widths[i]/2,y,size,on?'#ffe03a':'#ffffff','#000');x+=widths[i]+sp;});
  ui.restore();
}
